name: Release

# Fires on version tags only (e.g. "1.0", "1.2.3") - no "v" prefix, so the tag can be used
# verbatim as the F-Droid `commit:` value and in the `Binaries:` URL template (%v).
on:
  push:
    tags:
      - "[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify tag matches the app's versionName
        run: |
          tag="${{ github.ref_name }}"
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Tag '$tag' does not match versionName '$version_name' in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Checksum the APK
        run: |
          apk="app/build/outputs/apk/release/Locker-${{ github.ref_name }}.apk"
          sha256sum "$apk" | awk '{print $1}' > "$apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/Locker-${{ github.ref_name }}.apk
            app/build/outputs/apk/release/Locker-${{ github.ref_name }}.apk.sha256
